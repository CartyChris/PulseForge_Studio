<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PulseForge Studio app icon (original artwork): an anvil with a glowing pulse line. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2420"/>
      <stop offset="1" stop-color="#0e0b0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8663c" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#e8663c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e8663c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f28a5c"/>
      <stop offset="0.35" stop-color="#e8663c"/>
      <stop offset="1" stop-color="#9c3a1a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8663c" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ff9f6e"/>
      <stop offset="0.5" stop-color="#fff1e6"/>
      <stop offset="0.82" stop-color="#ff9f6e"/>
      <stop offset="1" stop-color="#e8663c" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- anvil -->
    <path fill="url(#anvil)" d="
      M 236 548
      C 290 520 340 508 372 506
      L 372 494 L 790 494 L 790 560
      C 742 566 704 584 676 606
      L 640 628 L 640 682
      L 704 722 L 704 760 L 380 760 L 380 722
      L 444 682 L 444 628 L 408 606
      C 360 592 300 574 236 548 Z"/>
    <path fill="#fff" fill-opacity="0.18" d="M 372 494 L 790 494 L 790 512 L 372 512 Z"/>
    <path fill="#000" fill-opacity="0.25" d="M 380 740 L 704 740 L 704 760 L 380 760 Z"/>
    <!-- pulse line: glow then core -->
    <polyline filter="url(#blur)" fill="none" stroke="#ff7a45" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"
      points="190,420 420,420 456,360 506,226 560,462 604,384 634,420 834,420"/>
    <polyline fill="none" stroke="url(#pulse)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
      points="190,420 420,420 456,360 506,226 560,462 604,384 634,420 834,420"/>
    <!-- sparks -->
    <g fill="#ffb38a">
      <circle cx="702" cy="300" r="10"/>
      <circle cx="748" cy="352" r="6"/>
      <circle cx="660" cy="250" r="5"/>
      <circle cx="330" cy="330" r="7"/>
      <circle cx="292" cy="372" r="4"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
</svg>
